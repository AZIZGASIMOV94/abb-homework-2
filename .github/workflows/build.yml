name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B verify

  docker-compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start both services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: client-service reaches greeting-service over the Docker network
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fs http://localhost:8080/greeting) && break
            sleep 2
          done
          echo "Response: $body"
          test "$body" = "Hello from greeting-service"
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
