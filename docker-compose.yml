services:
  greeting-service:
    build: ./greeting-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  client-service:
    build: ./client-service
    ports:
      - "8080:8080"
    environment:
      GREETING_SERVICE_URL: http://greeting-service:8081
    depends_on:
      greeting-service:
        condition: service_healthy
